name: Weekly CalGEM ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

concurrency:
  group: "weekly-calgem-ingest"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest tests

      - name: Run public data ingest
        run: python backend/run_ingest.py

      # The data commit is pushed with GITHUB_TOKEN, which does not start a push
      # deploy; deploy.yml redeploys from this workflow's success instead. The
      # weekly commit also counts as repository activity for scheduled workflows.
      - name: Commit data store
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Weekly CalGEM ingest $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the data commit"
          exit 1
