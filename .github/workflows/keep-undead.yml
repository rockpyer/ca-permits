name: keep-undead

# GitHub disables scheduled workflows after 60 days without repository activity
# (that is what stopped the weekly ingest in Aug 2026). Re-enabling each scheduled
# workflow through the API keeps them alive without making commits.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 14 1,22 * *"

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in weekly-ingest.yml keepalive.yml keep-undead.yml; do
            gh api --method PUT "repos/$REPO/actions/workflows/$workflow/enable"
            state=$(gh api "repos/$REPO/actions/workflows/$workflow" --jq .state)
            echo "$workflow: $state"
          done
