name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Rebuild the static data snapshot after each weekly ingest commits new data.
  workflow_run:
    workflows: ["Weekly CalGEM ingest"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # On workflow_run this checks out the default branch tip, which includes the
      # data commit the ingest just pushed.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keeps CalGEM's ~43 MB monthly wells CSV between runs; the snapshot re-downloads
      # only when the file's ETag/Last-Modified changes.
      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: frontend/.cache
          key: calgem-sources-${{ github.run_id }}
          restore-keys: calgem-sources-

      - name: Build
        env:
          SNAPSHOT_REQUIRED: "1"
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
