name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Worker tests
        working-directory: worker
        run: npm test

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npm test
