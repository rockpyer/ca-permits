name: Weekly WOGCC ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto follows data/ingest_plan.json; full or delta forces one"
        type: choice
        options: [auto, delta, full]
        default: auto
  schedule:
    # Monday, after the CalGEM (11:17 UTC) and ECMC (11:47 UTC) ingests.
    - cron: "13 12 * * 1"

concurrency:
  group: "weekly-wogcc-ingest"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest tests

      - name: Run WOGCC ingest
        env:
          INGEST_MODE: ${{ inputs.mode || 'auto' }}
        run: python backend/ingest_wyoming.py

      # Pushed with GITHUB_TOKEN, which does not start a push deploy; deploy.yml
      # redeploys from this workflow's success instead.
      # Also after a failed ingest: the run record (with its error) reaches /admin. The job
      # still fails, so deploy.yml does not redeploy.
      - name: Commit data store
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/wy
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Weekly WOGCC ingest $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the data commit"
          exit 1
