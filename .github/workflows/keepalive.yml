name: Midweek freshness check

# Fails loudly if the weekly ingest has stalled (for example, GitHub disabled the
# schedule or CalGEM changed a layer) instead of letting the site go quietly stale.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 15 * * 4"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check latest ingest run
        run: |
          set -euo pipefail
          last=$(head -n 1 data/etl_runs.jsonl | jq -r '.finished_at // empty')
          echo "Latest successful ingest: $last"
          if [ -z "$last" ]; then
            echo "::error::No ingest run recorded in data/etl_runs.jsonl"
            exit 1
          fi
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "Ingest age: ${age_days} days"
          if [ "$age_days" -gt 9 ]; then
            echo "::error::Last successful ingest was ${age_days} days ago. Check the Weekly CalGEM ingest workflow."
            exit 1
          fi
